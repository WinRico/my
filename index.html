    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="" />
        <title>Калькулятор</title>
        <!-- Favicon-->
        <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
        <!-- Bootstrap icons-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" type="text/css" />
        <!-- Google fonts-->
        <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700,300italic,400italic,700italic" rel="stylesheet" type="text/css" />
        <!-- Core theme CSS (includes Bootstrap)-->
        <link href="css/styles.css" rel="stylesheet" />
    </head>
    <body>
        <!-- Navigation-->
        <nav class="navbar navbar-dark bg-dark static-top">
            <div class="container">
                <a class="navbar-brand" href="#!">CULT AUTO</a>
              <!--<a class="btn btn-primary" href="#signup">Sign Up</a>-->
            </div>
        </nav>
        <!-- Masthead-->
        <header class="masthead">
            <div class="container position-relative">
                <div class="row justify-content-center">
                    <div class="col-xl-6">
                        <div class="text-center text-white">
                            <!-- Page heading-->
                            <h1 class="mb-5">Заповніть поля для отримання прорахунків!</h1>
                            <!-- Body place-->
                             <div class="form-group">
                                <div class="switcher">
                                
                                    <input type="radio" name="auction" id="copart" checked>
                                    <label for="copart">COPART</label>
                                
                                    <input type="radio" name="auction" id="iaai">
                                    <label for="iaai">IAAI</label>
                                
                                </div>
                            </div>
                            <br>

                            <div class="form-group">
                                <div class="switcher">
                                    <input type="radio" name="fuel" id="benz" checked>
                                    <label for="benz">Бензин</label>

                                    <input type="radio" name="fuel" id="dyzel">
                                    <label for="dyzel">Дизель</label>

                                    <input type="radio" name="fuel" id="gybryd">
                                    <label for="gybryd">Гібрид</label>

                                    <input type="radio" name="fuel" id="electro">
                                    <label for="electro">Електро</label>
                                </div>
                            </div>
                            <br>
                            <div class="form-group">
                                <div class="switcher">
                                    <input type="radio" name="kuzov" id="leghko" checked>
                                    <label for="leghko">Легковий</label>

                                    <input type="radio" name="kuzov" id="parketnyk">
                                    <label for="parketnyk">Паркетник</label>

                                    <input type="radio" name="kuzov" id="overroud">
                                    <label for="overroud">Позашляховик</label>

                                    <input type="radio" name="kuzov" id="moto">
                                    <label for="moto">Мото</label>
                                </div>
                            
                            </div>
                             <div class="form-group">
                                <label for="exampleFormControlSelect1"></label>
                                <select class="form-control" id="exampleFormControlSelect1">
                                <option value="" disabled selected>Площадка</option>
                                </select>
                            </div>
                            <br>
                            <div class="form-group form-grid-3">
                                  <div class="field">
                                      <label for="year">Рік випуску :</label>
                                      <select class="form-control"  id="year">
                                        <option value="" disabled selected >Рік випуску</option>
                                          <option>2010</option>
                                          <option>2011</option>
                                          <option>2012</option>
                                          <option>2013</option>
                                          <option>2014</option>
                                          <option>2015</option>
                                          <option>2016</option>
                                          <option>2017</option>
                                          <option>2018</option>
                                          <option>2019</option>
                                          <option>2020</option>
                                          <option>2021</option>
                                          <option>2022</option>
                                          <option>2023</option>
                                          <option>2024</option>
                                          <option>2025</option>
                                          <option>2026</option>
                                        </select>
                                    </div>
                                 <div class="field">
                                      <label for="pricelote">Вартість лоту:</label>
                                      <input class="form-control" id="pricelote" type="text">
                                 </div>
                                <div class="field">
                                     <label for="valm2">Об'єм в куб.см (0000):</label>
                                     <input class="form-control" type="text" id="valm2">
                                 </div>
                            </div>
                            <div class="form-group">
                              <div class="form-grid">
                                  <div class="field">
                                      <label for="broker">Брокер :</label>
                                      <input class="form-control" type="text" id="broker" value="150">
                                  </div>
                              
                                  <div class="field">
                                      <label for="expedition">Експедиція :</label>
                                      <input class="form-control" type="text" id="expedition" value="400">
                                  </div>
                              
                                  <div class="field">
                                      <label for="poscomp">Послуги компанії:</label>
                                      <input class="form-control" type="text" id="poscomp" value="600">
                                  </div>
                              
                                  <div class="field">
                                      <label for="repair">Ремонт :</label>
                                      <input class="form-control" type="text" id="repair" value="0">
                                  </div>
                              
                              </div>
                          
                            </div>
                        </div>
                        </div>
                    </div>
                </div>
            </div>
        </header>
        
        <!--Footer-->
        <footer class="footer bg-dark">
            <div class="container">
                <div class="row">sadasd
                      Пустий футер 
                </div>
            </div>
